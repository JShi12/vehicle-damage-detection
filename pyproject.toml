[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardd"
version = "0.1.0"
description = "Vehicle damage detection (YOLO11 / CarDD) - training pipeline and inference service"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9,<3.13"
authors = [{ name = "Jing Shi", email = "jingshi1988@gmail.com" }]
dependencies = [
    "ultralytics==8.4.90",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
train = ["mlflow>=2.14", "matplotlib", "pycocotools", "opencv-python", "polars", "albumentations"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart", "pillow", "requests"]
ui = ["streamlit>=1.30", "requests>=2.31", "pillow>=10.0"]
dev = ["pytest>=8", "ruff>=0.4", "httpx", "pillow", "streamlit>=1.30"]

[project.scripts]
cardd-eda = "cardd.cli.eda:main"
cardd-convert = "cardd.cli.convert:main"
cardd-verify = "cardd.cli.verify:main"
cardd-train = "cardd.cli.train:main"
cardd-evaluate = "cardd.cli.evaluate:main"
cardd-promote = "cardd.cli.promote:main"

[project.urls]
Source = "https://github.com/JShi12/vehicle-damage-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
# Notebooks aren't held to library-code style rules: 01_cardd_yolo11n.ipynb and
# 02_kaggle-yolo11-cardd-imgsz.ipynb are executed evidentiary artifacts kept deliberately
# untouched (see README), and Kaggle-magic cells (!pip install, %cd) aren't meaningfully
# lintable the same way as plain .py modules.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Explicit baseline (pycodestyle errors, pyflakes, isort, pyupgrade) rather than relying on
# whatever ruff's own default rule set happens to be - keeps `ruff check` results stable across
# ruff versions instead of silently picking up new rule categories on a version bump.
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# `cardd` lives under src/ and `tests` at the repo root - without this, ruff's isort (I001) has to
# auto-detect which top-level names count as first-party, and that auto-detection was observed to
# disagree between a local macOS checkout and CI's Linux runner (same ruff version, same pyproject
# config): "tests.*" imports passed locally but got flagged for wrong grouping in CI. Declaring
# both explicitly removes the ambiguity instead of just reordering the two files that happened to
# trip on it - it would resurface on any new test file otherwise.
known-first-party = ["cardd", "tests"]
